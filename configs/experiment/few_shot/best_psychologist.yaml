# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: narcissistic_posts_simple
  - override /model: few_shot
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["few_shot", "choosing_best_prompt_on_val"]

seed: 12345

model:
  number_of_shots: 5
  model_role: You are world leading psychologist specializing in narcissism detection in NARQ scale. Quantify the narcissism level on a scale from 1 to 6. Return only a float number without any additional text.
  

data:
  label_category: riv